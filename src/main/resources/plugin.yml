name: GitEconomy
main: com.gitepildev.giteconomy.core.GitEconomyPlugin
version: ${project.version}
website: https://github.com/gitEpildev/GitEconomy
authors: [GitEpildev, Epildevconnect Ltd]
api-version: 1.21
description: Simple Vault-compatible economy by GitEpildev & Epildevconnect Ltd
depend: [Vault]
softdepend: [PlaceholderAPI]

commands:
  balance:
    description: Check your balance or another player's balance
    usage: /balance [player] [currency]
    aliases: [bal]
  eco:
    description: Admin economy control (give, take, set)
    usage: /eco <give|take|set> <player> <amount> [currency]
  baltop:
    description: Show top player balances
    usage: /baltop [amount]
    aliases: [top]
  pay:
    description: Pay money to another player or all players
    usage: /pay <player|*> <amount> [currency]
    aliases: [gitpay]
  payall:
    description: Pay money to all players (alias for /pay *)
    usage: /payall <amount> [currency]
    aliases: [gitpayall]
  currency:
    description: View or set your preferred currency
    usage: /currency [currency]
  giteconomy:
    description: GitEconomy admin utilities
    usage: /giteconomy <cleanup|reload|database>

permissions:
  giteconomy.balance.others:
    description: Allows checking other players' balances
    default: true
  giteconomy.pay:
    description: Allows paying other players
    default: true
  giteconomy.eco:
    description: Allows admin economy commands
    default: op
  giteconomy.baltop:
    description: Allows viewing the balance top list
    default: true
  giteconomy.currency:
    description: Allows viewing or setting preferred currency
    default: true
  giteconomy.payall:
    description: Allows using /pay * to pay all players
    default: op
  giteconomy.payall.bypasswithdraw:
    description: Allows paying all without withdrawing from sender balance
    default: op
  giteconomy.admin:
    description: Allows GitEconomy admin utilities
    default: op
